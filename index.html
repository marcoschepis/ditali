<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ditali</title>
    <link rel="icon" type="image/jpeg" href="ditale.jpg">
    <link rel="stylesheet" href="style.css">

    <!-- Collegamento al Manifest PWA -->
    <link rel="manifest" href="manifest.json">

    <!-- Colore della barra di stato per Android/Chrome -->
    <meta name="theme-color" content="#0f172a">

    <!-- Configurazione per iOS / Safari (Rimuove la barra di navigazione) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ditali">
    <link rel="apple-touch-icon" href="ditale.jpg">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- SELETTORE STANZE E AZIONI -->
  <div class="rooms-bar">
    <div class="rooms-tabs-container">
      <span class="rooms-total-badge" color="#000000" id="totalCount">Tot: 0</span>
      <div id="roomsTabs" class="rooms-tabs"></div>
      
      <!-- LEGENDA COLORI CATEGORIE -->
      <div id="colorLegend" class="color-legend"></div>

      <button onclick="creaNuovaStanza()" class="btn-add-room editor-only">+ Nuova Stanza</button>
    </div>
    <div class="rooms-actions">
      <button id="btnToggleMode" onclick="toggleModalita()" class="btn-mode-toggle">✏️ Modifica</button>
      <button onclick="apriModalStatistiche()" class="btn-stats">📊 Statistiche</button>
    </div>
  </div>

  <div class="main-layout">
    
    <!-- MAPPA STANZA -->
    <section class="room-panel">
      <div id="roomGrid" class="room-grid"></div>
    </section>

    <!-- SIDEBAR CONTROLLI CON TAB SELEZIONABILI -->
    <aside class="sidebar">
      
      <!-- MENU A SCHEDE PER MOBILE & DESKTOP -->
      <div class="sidebar-tabs">
        <button class="side-tab" onclick="mostraSideTab('tabStanza')">📐 Dimensioni</button>
        <button class="side-tab" onclick="mostraSideTab('tabCategorie')">🏷️ Categorie</button>
        <button class="side-tab active" onclick="mostraSideTab('tabSelezione')">⚙️ Selezione</button>
        <button class="side-tab" onclick="mostraSideTab('tabSalva')">💾 Salva</button>
      </div>

      <!-- TAB 0: CONFIGURAZIONE STANZA -->
      <div id="tabStanza" class="card-section tab-content">
        <h3>📐 Dimensioni Griglia</h3>
        <div class="dim-config-group">
          <label>Righe: 
            <input type="number" id="roomRows" value="10" min="5" max="40" onchange="ridimensionaStanza()">
          </label>
          <label>Colonne: 
            <input type="number" id="roomCols" value="14" min="5" max="40" onchange="ridimensionaStanza()">
          </label>
        </div>
      </div>

      <!-- TAB 1: EDITOR SELEZIONE & DIMENSIONI -->
      <div id="tabSelezione" class="card-section tab-content active">
        <div class="selection-header">
            <h3>⚙️ Applica alla Selezione</h3>
            <div id="selectionInfo" class="info-msg">Nessuna cella selezionata.</div>
        </div>

        <div id="editorForm" style="display: none;">
          <select id="tileType" onchange="toggleTipoInputs()">
            <option value="vuoto">⬜ Spazio Vuoto</option>
            <option value="muro">🧱 Muro</option>
            <option value="bacheca">🖼️ Bacheca</option>
          </select>

          <!-- OPZIONI MURO -->
          <div id="muroOptions" style="display: none;" class="opt-group">
            <label for="muroColor">Colore Muro:
              <input type="color" id="muroColor" value="#334155" title="Scegli colore muro">
            </label>
          </div>

          <!-- OPZIONI BACHECA -->
          <div id="bachecaOptions" style="display: none;" class="opt-group">
            <label for="bachecaCategorySelect">Seleziona Categoria:
              <select id="bachecaCategorySelect"></select>
            </label>
            <p class="cat-color-preview-text">
              Il colore dello sfondo è legato alla categoria scelta.
            </p>
          </div>

          <button onclick="applicaASelezione()" class="btn-apply">Applica Selezione</button>
          <button onclick="deselezionaTutto()" class="btn-sec full-width-mt">Annulla Selezione</button>
        </div>
      </div>

      <!-- TAB 2: GESTIONE CATEGORIE -->
      <div id="tabCategorie" class="card-section tab-content">
        <h3>🏷️ Categorie Bacheche</h3>
        
        <div class="cat-form">
          <input type="text" id="newCatInput" placeholder="Nome (es. Italia, Europa...)">
          <div class="cat-color-pick">
            <input type="color" id="newCatColor" value="#0284c7" title="Scegli colore categoria">
            <button onclick="aggiungiCategoria()">Aggiungi</button>
          </div>
        </div>

        <div id="categoriesList" class="categories-list"></div>
      </div>

      <!-- TAB 3: SALVATAGGIO / CARICAMENTO -->
      <div id="tabSalva" class="card-section tab-content">
        <h3>💾 Salva / Carica</h3>
        <button onclick="esportaJSON()" class="btn-sec full-width-mb">📥 Esporta JSON</button>
        <button onclick="document.getElementById('importInput').click()" class="btn-sec full-width-mb">📤 Importa JSON</button>
        <button onclick="salvaSuGitHub()" class="btn-primary full-width">🌐 Salva online</button>
        <input type="file" id="importInput" accept=".json" style="display:none" onchange="importaJSON(event)">
      </div>

    </aside>

  </div>

  <!-- Struttura della Modal Statistiche -->
  <div id="statsModal" class="modal-overlay" onclick="chiudiModalStatistiche(event)">
    <div class="modal-body" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2>📊 Statistiche Collezione</h2>
        <button class="btn-close-modal" onclick="chiudiModalStatistiche()">✕</button>
      </div>

      <div class="stats-overview">
        <div class="stat-card">
          <span class="stat-label">Totale Ditali</span>
          <strong id="statTotalCount" class="stat-value">0</strong>
        </div>
        <div class="stat-card">
          <span class="stat-label">Stanze Configurate</span>
          <strong id="statRoomsCount" class="stat-value">0</strong>
        </div>
      </div>

      <div class="charts-grid">
        <div class="chart-box">
          <h3>Ditali per Categoria</h3>
          <div class="chart-wrapper">
            <canvas id="chartCategorie"></canvas>
          </div>
        </div>
        <div class="chart-box">
          <h3>Ditali per Stanza</h3>
          <div class="chart-wrapper">
            <canvas id="chartStanze"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
